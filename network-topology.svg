    <rect class="switch" x="430" y="155" width="50" height="30"/>
    <text x="455" y="175" text-anchor="middle" class="tiny">S1</text>

    <rect class="switch" x="590" y="150" width="58" height="30"/>
    <text x="619" y="170" text-anchor="middle" class="tiny">S2</text>

    <rect class="switch" x="690" y="150" width="58" height="30"/>
