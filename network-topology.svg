    <text x="200" y="380" text-anchor="middle" class="tiny">R1</text>
    <rect class="tag2" x="120" y="395" width="120" height="22"/>
    <text x="180" y="411" text-anchor="middle" class="tiny">PT8200</text>
  </g>

