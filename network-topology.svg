<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#cfcfcf"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
    <style>
      .label { fill: #111; font: 14px Arial, sans-serif; }
      .small { fill: #111; font: 12px Arial, sans-serif; }
      .node { fill: #d9edf7; stroke: #1f5f81; stroke-width: 1.2; }
      .switch { fill: #7ab6cf; stroke: #1f5f81; stroke-width: 1.2; }
      .router { fill: #b9d8e4; stroke: #1f5f81; stroke-width: 1.2; }
      .server { fill: #7ab6cf; stroke: #1f5f81; stroke-width: 1.2; }
      .host { fill: #dcece7; stroke: #2a7d67; stroke-width: 1.2; }
      .wire { stroke: #000; stroke-width: 3; fill: none; }
      .wire-green { stroke: #26bf5e; stroke-width: 3; fill: none; }
      .wire-orange { stroke: #f39c12; stroke-width: 3; fill: none; }
      .wire-blue { stroke: #1c7ec4; stroke-width: 3; fill: none; }
      .tag { fill: #fff; stroke: #111; stroke-width: 1; rx: 4; }
      .siteTag { fill: #fff; stroke: #111; stroke-width: 1; rx: 4; }
    </style>
  </defs>

  <!-- Top row PCs -->
  <g>
    <rect x="530" y="35" width="52" height="38" class="host"/>
    <text x="553" y="58" text-anchor="middle" class="small">PC0</text>
    <rect x="610" y="35" width="52" height="38" class="host"/>
    <text x="636" y="58" text-anchor="middle" class="small">PC1</text>
    <rect x="690" y="35" width="52" height="38" class="host"/>
    <text x="716" y="58" text-anchor="middle" class="small">PC2</text>
    <rect x="538" y="70" width="94" height="46" class="tag"/>
    <text x="585" y="98" text-anchor="middle" class="label">192.168.20.3</text>
    <rect x="687" y="70" width="94" height="46" class="tag"/>
    <text x="734" y="98" text-anchor="middle" class="label">192.168.20.2</text>
  </g>

  <!-- Main switch cluster -->
  <g>
    <rect x="350" y="150" width="65" height="40" class="switch"/>
    <text x="383" y="175" text-anchor="middle" class="small">Core</text>
    <rect x="430" y="150" width="65" height="40" class="switch"/>
    <text x="463" y="175" text-anchor="middle" class="small">Switch</text>
    <rect x="510" y="150" width="65" height="40" class="switch"/>
    <text x="543" y="175" text-anchor="middle" class="small">Switch</text>
    <rect x="738" y="150" width="65" height="40" class="switch"/>
    <text x="771" y="175" text-anchor="middle" class="small">Switch</text>
    <rect x="818" y="150" width="65" height="40" class="switch"/>
    <text x="851" y="175" text-anchor="middle" class="small">Switch</text>
  </g>

  <!-- Left side VLAN router -->
  <g>
    <rect x="120" y="320" width="62" height="36" class="router"/>
    <text x="151" y="343" text-anchor="middle" class="small">R1</text>
    <rect x="80" y="355" width="130" height="40" class="tag"/>
    <text x="145" y="381" text-anchor="middle" class="label">PT8200</text>
  </g>

  <!-- Middle topology -->
  <g>
    <rect x="305" y="248" width="70" height="42" class="switch"/>
    <text x="340" y="274" text-anchor="middle" class="small">2960-24TT</text>
    <rect x="520" y="248" width="70" height="42" class="switch"/>
    <text x="555" y="274" text-anchor="middle" class="small">2960-24TT</text>
    <rect x="730" y="248" width="70" height="42" class="switch"/>
    <text x="765" y="274" text-anchor="middle" class="small">2960-24TT</text>
    <rect x="548" y="485" width="70" height="42" class="switch"/>
    <text x="583" y="511" text-anchor="middle" class="small">2960-24TT</text>
  </g>

  <!-- Servers -->
  <g>
    <rect x="760" y="360" width="64" height="42" class="server"/>
    <text x="792" y="385" text-anchor="middle" class="small">Server</text>
    <rect x="875" y="390" width="64" height="42" class="server"/>
    <text x="907" y="415" text-anchor="middle" class="small">Server</text>
    <rect x="940" y="510" width="64" height="42" class="server"/>
    <text x="972" y="535" text-anchor="middle" class="small">Server</text>
    <rect x="850" y="600" width="64" height="42" class="server"/>
    <text x="882" y="625" text-anchor="middle" class="small">Server</text>
    <rect x="560" y="640" width="64" height="42" class="server"/>
    <text x="592" y="665" text-anchor="middle" class="small">Server</text>
  </g>

  <!-- Access switches -->
  <g>
    <rect x="380" y="430" width="74" height="38" class="switch"/>
    <text x="417" y="453" text-anchor="middle" class="small">Acc Sw 1</text>
    <rect x="590" y="430" width="74" height="38" class="switch"/>
    <text x="627" y="453" text-anchor="middle" class="small">Acc Sw 2</text>
    <rect x="740" y="555" width="74" height="38" class="switch"/>
    <text x="777" y="578" text-anchor="middle" class="small">Acc Sw 3</text>
    <rect x="420" y="605" width="74" height="38" class="switch"/>
    <text x="457" y="628" text-anchor="middle" class="small">Acc Sw 4</text>
  </g>

  <!-- Client devices -->
  <g>
    <rect x="235" y="455" width="54" height="36" class="host"/>
    <text x="262" y="478" text-anchor="middle" class="small">PC</text>
    <rect x="180" y="650" width="54" height="36" class="host"/>
    <text x="207" y="673" text-anchor="middle" class="small">PC</text>
    <rect x="1020" y="620" width="54" height="36" class="host"/>
    <text x="1047" y="643" text-anchor="middle" class="small">PC</text>
    <rect x="990" y="435" width="54" height="36" class="host"/>
    <text x="1017" y="458" text-anchor="middle" class="small">PC</text>
    <rect x="300" y="610" width="54" height="36" class="host"/>
    <text x="327" y="633" text-anchor="middle" class="small">PC</text>
  </g>

  <!-- Labels -->
  <g>
    <rect x="100" y="180" width="144" height="40" class="siteTag"/>
    <text x="172" y="205" text-anchor="middle" class="label">192.168.1.1</text>
    <text x="172" y="225" text-anchor="middle" class="small">VLAN 10 : DEPT A</text>

    <rect x="80" y="520" width="170" height="42" class="siteTag"/>
    <text x="165" y="548" text-anchor="middle" class="label">DEPT B VLAN:20 192.168.20.1</text>

    <rect x="870" y="150" width="120" height="40" class="siteTag"/>
    <text x="930" y="175" text-anchor="middle" class="label">192.168.20.2</text>

    <rect x="930" y="260" width="120" height="40" class="siteTag"/>
    <text x="990" y="285" text-anchor="middle" class="label">192.168.13</text>

    <rect x="920" y="630" width="150" height="40" class="siteTag"/>
    <text x="995" y="655" text-anchor="middle" class="label">192.168.1.2</text>
    <text x="995" y="675" text-anchor="middle" class="small">PC-PT</text>
  </g>

  <!-- Main network wires -->
  <g>
    <path d="M 182 338 L 340 270" class="wire"/>
    <path d="M 182 338 L 520 270" class="wire"/>
    <path d="M 182 338 L 730 270" class="wire"/>
    <path d="M 383 190 L 520 270" class="wire"/>
    <path d="M 463 190 L 555 270" class="wire"/>
    <path d="M 543 190 L 720 270" class="wire"/>
    <path d="M 771 190 L 770 270" class="wire"/>
    <path d="M 851 190 L 820 270" class="wire"/>

    <path d="M 340 290 L 417 430" class="wire"/>
    <path d="M 555 290 L 627 430" class="wire"/>
    <path d="M 765 290 L 777 555" class="wire"/>

    <path d="M 417 468 L 262 455" class="wire-green"/>
    <path d="M 417 468 L 207 650" class="wire-green"/>
    <path d="M 627 468 L 1017 435" class="wire-green"/>
    <path d="M 627 468 L 1047 620" class="wire-green"/>
    <path d="M 777 593 L 327 610" class="wire-green"/>
    <path d="M 777 593 L 592 640" class="wire-green"/>

    <path d="M 440 605 L 592 640" class="wire-orange"/>
    <path d="M 792 402 L 907 390" class="wire-blue"/>
    <path d="M 907 432 L 972 510" class="wire-blue"/>
    <path d="M 882 600 L 1047 620" class="wire-blue"/>
  </g>

  <!-- Small green/orange indicator dots -->
  <g>
    <circle cx="180" cy="338" r="6" fill="#35d46a"/>
    <circle cx="340" cy="270" r="6" fill="#35d46a"/>
    <circle cx="520" cy="270" r="6" fill="#35d46a"/>
    <circle cx="730" cy="270" r="6" fill="#35d46a"/>
    <circle cx="417" cy="430" r="6" fill="#35d46a"/>
    <circle cx="627" cy="430" r="6" fill="#35d46a"/>
    <circle cx="777" cy="555" r="6" fill="#35d46a"/>
    <circle cx="262" cy="455" r="6" fill="#35d46a"/>
    <circle cx="207" cy="650" r="6" fill="#35d46a"/>
    <circle cx="1017" cy="435" r="6" fill="#35d46a"/>
    <circle cx="1047" cy="620" r="6" fill="#35d46a"/>
    <circle cx="327" cy="610" r="6" fill="#35d46a"/>
    <circle cx="592" cy="640" r="6" fill="#35d46a"/>
    <circle cx="440" cy="605" r="6" fill="#f39c12"/>
    <circle cx="792" cy="360" r="6" fill="#f39c12"/>
    <circle cx="907" cy="390" r="6" fill="#f39c12"/>
    <circle cx="972" cy="510" r="6" fill="#f39c12"/>
    <circle cx="882" cy="600" r="6" fill="#f39c12"/>
  </g>

  <!-- Additional small node labels -->
  <g>
    <rect x="260" y="170" width="120" height="34" class="tag"/>
    <text x="320" y="192" text-anchor="middle" class="small">192.168.20.1</text>
    <rect x="650" y="200" width="120" height="34" class="tag"/>
    <text x="710" y="222" text-anchor="middle" class="small">PC-PT</text>
    <rect x="430" y="610" width="120" height="34" class="tag"/>
    <text x="490" y="632" text-anchor="middle" class="small">Server-PT</text>
  </g>
</svg>
