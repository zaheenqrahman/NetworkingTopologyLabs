<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="768" viewBox="0 0 1440 768">
  <defs>
    <style>
      .bg { fill: #d3d3d3; }
      .label { fill: #111; font: 700 13px Arial, sans-serif; }
      .small { fill: #111; font: 700 12px Arial, sans-serif; }
      .tiny { fill: #111; font: 700 11px Arial, sans-serif; }
      .node { fill: #cfe8f6; stroke: #3a3a3a; stroke-width: 1.2; }
      .router { fill: #dfeaf2; stroke: #3a3a3a; stroke-width: 1.2; }
      .switch { fill: #7db8d0; stroke: #3a3a3a; stroke-width: 1.2; }
      .server { fill: #7fb9d1; stroke: #3a3a3a; stroke-width: 1.2; }
      .pc { fill: #dceef5; stroke: #3a3a3a; stroke-width: 1.2; }
      .wire { stroke: #0b0b0b; stroke-width: 3; fill: none; }
      .wireg { stroke: #2ecc71; stroke-width: 3; fill: none; }
      .wireo { stroke: #f39c12; stroke-width: 3; fill: none; }
      .tag { fill: rgba(255,255,255,0.85); stroke: #111; stroke-width: 1; }
      .tag2 { fill: rgba(255,255,255,0.7); stroke: #111; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1440" height="768"/>

  <!-- Top-right PCs -->
  <g>
    <rect class="pc" x="98" y="0" width="46" height="38"/>
    <rect class="pc" x="858" y="22" width="45" height="38"/>
    <rect class="pc" x="1015" y="22" width="45" height="38"/>
    <rect class="pc" x="1178" y="22" width="44" height="38"/>

    <text x="883" y="43" text-anchor="middle" class="tiny">PC-PT</text>
    <text x="1038" y="43" text-anchor="middle" class="tiny">PC0</text>
    <text x="1200" y="43" text-anchor="middle" class="tiny">PC1</text>

    <rect class="tag2" x="860" y="64" width="106" height="22"/>
    <text x="913" y="80" text-anchor="middle" class="tiny">192.168.20.3</text>
    <rect class="tag2" x="1008" y="64" width="106" height="22"/>
    <text x="1061" y="80" text-anchor="middle" class="tiny">192.168.20.2</text>
  </g>

  <!-- Middle core switches -->
